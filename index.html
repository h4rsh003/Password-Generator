<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <h1>PASSWORD GENERATOR</h1>
        <div class="display-container">
            <input readonly placeholder="PASSWORD" type="text" class="display" data-passwordDisplay >
            <button class="copyBtn" data-copy>
                <span data-copyMsg></span>
                <i class="fa-regular fa-copy"></i>
            </button>
        </div>
        <div class="input-container">
            <div class="length-container"> 
                <p>Password Length</p>
                <p class="count" data-lengthNumber>0</p>
            </div>
            <input type="range" min="0" max="20" step="1" class="slider" data-lengthSlider>
           
            <div class="check">
                <input type="checkbox" id="uppercase">
                <label for="uppercase">Include Uppercase Letters</label>
            </div>
            <div class="check">
                <input type="checkbox" id="lowercase">
                <label for="lowercase">Include Lowercase Letters</label>
            </div>
            <div class="check">
                <input type="checkbox" id="numbers">
                <label for="numbers">Include Numbers</label>
            </div>
            <div class="check">
                <input type="checkbox" id="symbols">
                <label for="symbols">Include Symbols</label>
            </div>
            <div class="strength-section">
                <p>Stregth</p>
                <div class="indicator" data-indicator></div>
            </div>
            <button class="genererateButton">GENERATE PASSWORD</button>
        </div>
    </div>



    <script src="index.js"></script>
    <script src="https://kit.fontawesome.com/b49f76d6fd.js" crossorigin="anonymous"></script>
</body>
</html>
